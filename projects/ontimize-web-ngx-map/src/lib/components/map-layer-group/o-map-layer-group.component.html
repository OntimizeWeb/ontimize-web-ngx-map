@if (description !== undefined && description.length > 0) {
  <button mat-button mat-ink class="o-flex o-flex-fill" [class.collapsed]="collapsed"
    style="display:flex; flex-direction:row; justify-content:space-around; align-items:center"
    (click)="toggleCollapse()">
    <!--<img class="layer-icon" *ngIf="icon && icon.length>0"[src]= "icon">-->
    <o-toggle-icon-button
      [clickable]="false"
      [icon-dark]="true"
      icon-name="folder"
      [button-active]="hasChildInWS()">
    </o-toggle-icon-button>
    <span class="o-flex o-flex-row" style="align-items:center; justify-content:flex-start">{{ description }}</span>
    <o-toggle-icon-button
      [clickable]="false" [icon-dark]="true" icon-name="keyboard_arrow_down">
    </o-toggle-icon-button>
  </button>
}
<div class="group-list o-flex o-flex-column" [class.collapsed]="collapsed" [class.expanded]="!collapsed"
  style="justify-content:space-between; align-items:stretch">
  @for (layerGroup of getLayerGroups(); track layerGroup.id) {
    <o-map-layer-group
      [group-id]          = "layerGroup.id"
      [group-id-parent]   = "layerGroup.idParent"
      [group-name]        = "layerGroup.name"
      [group-description] = "layerGroup.description"
      [group-collapsed]   = "layerGroup.collapsed"
      [group-ref]         = "layerGroup">
    </o-map-layer-group>
  }
  @for (layerConf of getMapLayers(); track layerConf.layerId) {
    <o-map-layer class="o-flex"
      [layer-radius]               = "layerConf.radius?.toString()"
      [layer-service]              = "layerConf.service"
      [layer-base-url]             = "layerConf.baseUrl"
      [layer-selected]             = "layerConf.selected"
      [layer-visible]              = "layerConf.visible"
      [layer-in-ws]                = "layerConf.inWS"
      [layer-id]                   = "layerConf.layerId"
      [layer-group-id]             = "layerConf.layerGroupId"
      [layer-type]                 = "layerConf.type"
      [layer-popup]                = "layerConf.popup"
      [layer-popup-url]            = "layerConf.popupUrl"
      [layer-menu-label]           = "layerConf.menuLabel"
      [layer-menu-label-secondary] = "layerConf.menuLabelSecondary"
      [layer-in-menu]              = "layerConf.showInMenu"
      [layer-center]               = "getLayerCenter(layerConf)"
      [layer-options]              = "layerConf.options">
    </o-map-layer>
  }
</div>
