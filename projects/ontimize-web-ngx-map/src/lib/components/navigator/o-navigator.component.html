<div class="o-flex-row" style="padding:4px; flex-wrap:wrap">
  <div class="search-panel on-map mat-elevation-z2 o-flex-row" style="align-items:center">
    @if (isSidenavButtonVisible) {
      <button mat-button class="mat-button" (click)="toggleSidenav($event)">
        <mat-icon>menu</mat-icon>
      </button>
    }
    @if (isSearchInputVisible) {
      <input id="place-input" class="on-map o-flex" type="text"
        [placeholder]="getText('SEARCH_PLACEHOLDER')" [(ngModel)]="address" (blur)="onBlur()" (click)="onFocus()">
    }
  </div>
</div>
@if (searchResults.length > 0) {
  <div class="o-flex-row" style="padding:4px; flex-wrap:wrap">
    <div class="search-results on-map mat-elevation-z2 o-flex o-flex-column" style="align-items:center; justify-content:flex-start"
      [class.rendered]="rendered">
      @for (item of searchResults; track item) {
        <o-navigator-item [search-result]="item.oSearchResult">
        </o-navigator-item>
      }
    </div>
  </div>
}
