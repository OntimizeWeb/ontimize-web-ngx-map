<div class="search-result o-flex-row">
  @if (searchResult.icon) {
    <i class="material-icons">{{ searchResult.icon }}</i>
  }
  <div class="o-flex o-flex-column" style="align-items:flex-start; justify-content:center">
    @if (searchResult.label) {
      <span>{{ searchResult.label }}</span>
    }
    @if (searchResult.sublabel) {
      <span class="sub-label">{{ searchResult.sublabel }}</span>
    }
  </div>
  @for (button of actions; track button) {
    <o-toggle-icon-button
      icon-dark="true" clickable="false"
      [icon-name]="getIcon(button)"
      [button-active]="button.status()"
      (click)="button.callback()">
    </o-toggle-icon-button>
  }
</div>
