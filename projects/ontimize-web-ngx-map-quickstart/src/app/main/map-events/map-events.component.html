<div class="o-flex-column bg-level-1 main-container">
  <div class="o-flex-row o-flex-grow" style="gap:20px">
    <example-comp comp-name="LAYERS.EVENTS.BASIC_USAGE" [files]="getFiles()" style="flex: 1 1 75%; box-sizing: border-box">
        <o-map #oMap center="42.940599, -7.120727" zoom="8" min-zoom="3" max-zoom="20" zoom-control="yes"
          search-control="no" layer-panel-visible="no" class="o-flex-grow" draw-control="no" (onDrawEvent)="addDrawEvent($event)">
          <!-- [crs-configuration]="objeto" -->
          <!-- <o-map-crs crs="EPSG4326"></o-map-crs> -->

          <!-- crs="26915" -->
          <o-map-draw-controls></o-map-draw-controls>
          <!-- <o-map-projection projection="26915"></o-map-projection> -->
          <!-- crs="9857"  -->

        </o-map>
    </example-comp>
    <div class="body-text-container" layout-padding style="flex: 1 1 25%; box-sizing: border-box">
      <h3>Triggering draw events</h3>
      <mat-divider></mat-divider>
      <div class="o-flex-column" style="justify-content:center; align-items:flex-start">
        @for (event of eventsArray; track event) {
          <div class="o-flex-row body-text" style="gap:8px" layout-padding>
            <span class="event-text"><strong>Event type:</strong> </span> <span>{{ event.type }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</div>
